name: Build Debian APT repository

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # for the apt repository
  REPO_NAME: daniele-athome-my
  CODENAME: trixie
  COMPONENTS: main
  ARCHITECTURES: amd64

jobs:
  build-moonlight-qt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - MOONLIGHT_REPO: https://github.com/moonlight-stream/moonlight-qt
            MOONLIGHT_COMMIT: v6.1.0
            name: stable

          - MOONLIGHT_REPO: https://github.com/games-on-whales/moonlight-qt
            MOONLIGHT_COMMIT: 1c06825543037c5ba1477847128942e8b8d9d798
            name: nightly

    name: Build moonlight-qt (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build moonlight-qt
        run: |
          docker build --build-arg="DEBEMAIL=${{ env.DEBEMAIL }}" --build-arg="GIT_REPO=${{ matrix.MOONLIGHT_REPO }}" --build-arg="GIT_COMMIT=${{ matrix.MOONLIGHT_COMMIT }}" -t build-moonlight-qt moonlight-qt

      - name: Extract Debian package from image
        run: |
          container_id=$(docker create build-moonlight-qt)
          docker cp "$container_id:/out/" .
          docker rm "$container_id"

      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: moonlight-qt-deb-${{ matrix.name }}
          path: ./out/*.deb
          if-no-files-found: error

  build-kodi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - DEBIAN_RELEASE: trixie
            name: 21.2

          - DEBIAN_RELEASE: testing
            name: 21.3

    name: Build kodi (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build kodi
        run: |
          docker build --build-arg="DEBIAN_RELEASE=${{ matrix.DEBIAN_RELEASE }}" --build-arg="DEBEMAIL=${{ env.DEBEMAIL }}" -t build-kodi kodi

      - name: Extract Debian package from image
        run: |
          container_id=$(docker create build-kodi)
          docker cp "$container_id:/out/" .
          docker rm "$container_id"

      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: kodi-deb-${{ matrix.name }}
          path: |
            ./out/kodi_*.deb
            ./out/kodi-bin_*.deb
            ./out/kodi-data_*.deb
          if-no-files-found: error

  build-uv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - UV_VERSION: ""
            UV_ARCH: "x86_64-unknown-linux-gnu"
            UV_DEBIAN_ARCH: "amd64"

    # TODO use variables in job name
    name: Build uv

    steps:
      - name: Download uv release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ matrix.UV_VERSION }}
          PKG_ARCH: ${{ matrix.UV_ARCH }}
        run: |
          set -euo pipefail
          mkdir -p dl

          if [ -n "$PKG_VERSION" ]; then
            TAG="$PKG_VERSION"
          else
            TAG="$(gh release view --repo astral-sh/uv --json tagName -q .tagName)"
          fi
          echo "Selected tag: $TAG"

          # The glob also grabs the checksum file in the same call.
          gh release download "$TAG" \
            --repo astral-sh/uv \
            --pattern 'uv-'"$PKG_ARCH"'.tar.gz*' \
            --dir dl

          echo "VERSION=${TAG}" >> "$GITHUB_ENV"

      - name: Extract binaries
        env:
          PKG_ARCH: ${{ matrix.UV_ARCH }}
        run: |
          set -euo pipefail
          TARBALL=dl/uv-${PKG_ARCH}.tar.gz

          mkdir -p extract build
          tar -xzf "$TARBALL" -C extract

          UV_BIN="$(find extract -type f -name uv | head -n1)"
          UVX_BIN="$(find extract -type f -name uvx | head -n1)"
          test -n "$UV_BIN" && test -n "$UVX_BIN"

          install -m 0755 "$UV_BIN"  build/uv
          install -m 0755 "$UVX_BIN" build/uvx
          ./build/uv --version

      - name: Generate nfpm config
        env:
          DEB_ARCH: ${{ matrix.DEBIAN_ARCH }}
        run: |
          set -euo pipefail
          cat > nfpm.yaml <<EOF
          name: "uv"
          arch: "${DEB_ARCH}"
          platform: "linux"
          version: "${VERSION}"
          version_schema: "semver"
          release: "1"
          section: "utils"
          priority: "optional"
          maintainer: "Astral Software Inc. <hey@astral.sh>"
          description: |
            An extremely fast Python package and project manager.
            Unofficial package built from the upstream release binaries.
          homepage: "https://github.com/astral-sh/uv"
          license: "MIT OR Apache-2.0"
          depends:
            - libc6
          contents:
            - src: ./build/uv
              dst: /usr/bin/uv
              file_info:
                mode: 0755
            - src: ./build/uvx
              dst: /usr/bin/uvx
              file_info:
                mode: 0755
          EOF
          cat nfpm.yaml

      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
          NFPM_VERSION: v2.47.0
        run: |
          set -euo pipefail
          gh release download "$NFPM_VERSION" \
            --repo goreleaser/nfpm \
            --pattern 'nfpm_*_amd64.deb' \
            --dir /tmp/nfpm
          sudo apt-get install -y /tmp/nfpm/nfpm_*_amd64.deb
          nfpm --version

      - name: Build deb package
        run: |
          set -euo pipefail
          mkdir -p dist
          nfpm package --config nfpm.yaml --packager deb --target dist/
          ls -l dist/

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: uv-deb-${{ env.VERSION }}-${{ matrix.UV_DEBIAN_ARCH }}
          path: dist/*.deb
          if-no-files-found: error

  build-repository:
    name: Create APT repository
    needs:
      - build-kodi
      - build-moonlight-qt
    runs-on: ubuntu-latest

    outputs:
      artifact_id: ${{ steps.upload-artifact.outputs.artifact-id }}
      keyring: ${{ steps.create-apt-repo.outputs.keyring }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Retrieve kodi packages
        uses: actions/download-artifact@v7
        with:
          pattern: kodi-deb-*
          path: repo
          merge-multiple: true

      - name: Retrieve moonlight-qt packages
        uses: actions/download-artifact@v7
        with:
          pattern: moonlight-qt-deb-*
          path: repo
          merge-multiple: true

      - name: Retrieve uv packages
        uses: actions/download-artifact@v7
        with:
          pattern: uv-deb-*
          path: repo
          merge-multiple: true

      - uses: morph027/apt-repo-action@v3
        id: create-apt-repo
        with:
          repo-name: ${{ env.REPO_NAME }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          codename: ${{ env.CODENAME }}
          components: ${{ env.COMPONENTS }}
          architectures: ${{ env.ARCHITECTURES }}
          scan-dir: repo

      - name: Copy other static files
        run: |
          cp .github/workflows/repo_index.html "${{ steps.create-apt-repo.outputs.dir }}/index.html" 

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ steps.create-apt-repo.outputs.dir }}

  deploy-repository:
    name: Deploy APT repository
    needs: build-repository
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Adding summary
        run: |
          echo ':rocket:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'curl -sfL "${{ steps.deployment.outputs.page_url }}gpg.key" | sudo tee /etc/apt/keyrings/${{ needs.build-repository.outputs.keyring }}' >> $GITHUB_STEP_SUMMARY
          echo 'echo "deb [signed-by=/etc/apt/keyrings/${{ needs.build-repository.outputs.keyring }}] ${{ steps.deployment.outputs.page_url }} ${{ env.CODENAME }} ${{ env.COMPONENTS }}" | sudo tee /etc/apt/sources.list.d/${{ env.REPO_NAME }}.list' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
